# https://docs.docker.com/compose/
# https://docs.docker.com/reference/compose-file/

# version: "1.0"
services:
  app:
    image: nextjs-dev
    container_name: my_container_name
    # build: ./path_folder_dockerfile/
    build:
      context: .
      dockerfile: ./dockerfile
    # command: sleep infinity
    command: bash
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    volumes:
      - myvolume:/etc/data
